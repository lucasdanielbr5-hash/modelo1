<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Paula Borch | Psicopedagogia & Alfabetização</title>

<meta name="description"
content="Paula Borch — Psicopedagogia, Alfabetização e Desenvolvimento. Atendimento individualizado para crianças e famílias.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">


<style>

/* =========================================================
   IDENTIDADE VISUAL
========================================================= */

:root {

    --navy: #17383d;
    --navy-light: #244d52;

    --sage: #a7b9aa;
    --sage-light: #e8eee8;

    --sand: #f3efe7;
    --cream: #faf8f3;

    --terracotta: #c98168;
    --gold: #b99a61;

    --white: #ffffff;

    --text: #4e5958;
    --muted: #78817f;

    --border: #e3e5df;

    --shadow:
        0 25px 70px rgba(25, 55, 59, .10);
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    font-family: "DM Sans", sans-serif;

    background: var(--cream);

    color: var(--text);

    line-height: 1.6;

    overflow-x: hidden;
}

img {
    max-width: 100%;
    display: block;
}

a {
    text-decoration: none;
    color: inherit;
}

button,
input,
textarea {
    font-family: inherit;
}


/* =========================================================
   CONTAINER
========================================================= */

.container {

    width: min(
        1180px,
        calc(100% - 48px)
    );

    margin: auto;
}


/* =========================================================
   HEADER
========================================================= */

header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    z-index: 1000;

    padding: 22px 0;

    transition: .35s ease;
}

header.scrolled {

    background: rgba(250,248,243,.94);

    backdrop-filter: blur(18px);

    padding: 14px 0;

    box-shadow:
        0 8px 30px rgba(20,50,50,.06);
}

.nav {

    display: flex;

    align-items: center;

    justify-content: space-between;
}


/* LOGO */

.brand {

    display: flex;

    align-items: center;

    gap: 12px;

    color: var(--navy);
}

.brand-symbol {

    width: 39px;
    height: 39px;

    border: 1.5px solid var(--navy);

    border-radius: 50%;

    display: grid;

    place-items: center;

    position: relative;
}

.brand-symbol::before {

    content: "";

    width: 12px;
    height: 19px;

    border-radius: 100% 0 100% 0;

    background: var(--terracotta);

    transform: rotate(-35deg);
}

.brand-name {

    font-size: 14px;

    font-weight: 700;

    letter-spacing: .14em;
}

.brand-sub {

    display: block;

    font-size: 8px;

    font-weight: 500;

    letter-spacing: .12em;

    color: var(--muted);

    margin-top: -2px;
}


/* NAV */

nav ul {

    list-style: none;

    display: flex;

    gap: 34px;
}

nav a {

    font-size: 13px;

    color: var(--text);

    transition: .25s;
}

nav a:hover {
    color: var(--terracotta);
}


.header-cta {

    background: var(--navy);

    color: white;

    padding: 12px 21px;

    border-radius: 100px;

    font-size: 12px;

    font-weight: 600;

    transition: .3s;
}

.header-cta:hover {

    background: var(--terracotta);

    transform: translateY(-2px);
}

.menu {

    display: none;

    background: none;

    border: 0;

    color: var(--navy);

    font-size: 26px;

    cursor: pointer;
}


/* =========================================================
   HERO
========================================================= */

.hero {

    min-height: 100vh;

    padding: 150px 0 80px;

    position: relative;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 10% 20%,
            rgba(167,185,170,.20),
            transparent 27%
        ),

        radial-gradient(
            circle at 95% 15%,
            rgba(201,129,104,.10),
            transparent 25%
        ),

        var(--cream);
}

.hero::after {

    content: "";

    position: absolute;

    width: 600px;
    height: 600px;

    border-radius: 50%;

    border: 1px solid rgba(23,56,61,.08);

    right: -280px;
    bottom: -300px;
}


.hero-grid {

    display: grid;

    grid-template-columns:
        .95fr 1.05fr;

    gap: 90px;

    align-items: center;

    position: relative;

    z-index: 2;
}


/* HERO TEXT */

.eyebrow {

    display: flex;

    align-items: center;

    gap: 12px;

    text-transform: uppercase;

    letter-spacing: .17em;

    font-size: 10px;

    font-weight: 700;

    color: var(--terracotta);

    margin-bottom: 22px;
}

.eyebrow::before {

    content: "";

    width: 32px;

    height: 1px;

    background: var(--terracotta);
}


h1 {

    font-family:
        "Playfair Display",
        serif;

    color: var(--navy);

    font-size:
        clamp(48px, 6vw, 78px);

    font-weight: 400;

    line-height: 1.02;

    letter-spacing: -.035em;

    margin-bottom: 27px;
}

h1 em {

    font-style: italic;

    color: var(--terracotta);
}

.hero-description {

    max-width: 500px;

    color: var(--muted);

    font-size: 16px;

    line-height: 1.85;

    margin-bottom: 32px;
}


.buttons {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;
}

.btn {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    padding: 15px 23px;

    border-radius: 100px;

    font-size: 13px;

    font-weight: 600;

    transition: .3s;
}

.btn-primary {

    background: var(--navy);

    color: white;

    box-shadow:
        0 12px 25px rgba(23,56,61,.15);
}

.btn-primary:hover {

    background: var(--navy-light);

    transform: translateY(-3px);
}

.btn-secondary {

    border: 1px solid var(--border);

    background: rgba(255,255,255,.45);

    color: var(--navy);
}

.btn-secondary:hover {

    background: white;

    transform: translateY(-3px);
}


/* =========================================================
   HERO PHOTO
========================================================= */

.hero-photo-area {

    position: relative;

    min-height: 610px;
}

.hero-photo {

    position: absolute;

    right: 20px;

    top: 0;

    width: 455px;

    height: 570px;

    object-fit: cover;

    object-position: center top;

    border-radius:
        230px
        230px
        18px
        18px;

    box-shadow: var(--shadow);
}


/* vertical label */

.photo-label {

    position: absolute;

    right: -20px;

    top: 95px;

    writing-mode:
        vertical-rl;

    text-transform: uppercase;

    letter-spacing: .18em;

    font-size: 9px;

    color: var(--muted);
}


/* floating card */

.hero-card {

    position: absolute;

    left: -20px;

    bottom: 55px;

    width: 220px;

    background: white;

    padding: 21px;

    border-radius: 18px;

    box-shadow: var(--shadow);

    border: 1px solid rgba(20,50,50,.05);
}

.hero-card small {

    display: block;

    text-transform: uppercase;

    letter-spacing: .13em;

    font-size: 9px;

    color: var(--terracotta);

    margin-bottom: 5px;
}

.hero-card strong {

    display: block;

    color: var(--navy);

    font-family:
        "Playfair Display",
        serif;

    font-size: 20px;

    font-weight: 500;

    line-height: 1.2;
}


/* =========================================================
   TRUST BAR
========================================================= */

.trust {

    background: var(--navy);

    color: white;

    padding: 21px 0;
}

.trust-grid {

    display: grid;

    grid-template-columns:
        repeat(4,1fr);

    gap: 30px;
}

.trust-item {

    border-left:
        1px solid
        rgba(255,255,255,.18);

    padding-left: 20px;
}

.trust-item:first-child {
    border-left: 0;
    padding-left: 0;
}

.trust-item strong {

    display: block;

    font-family:
        "Playfair Display",
        serif;

    font-size: 17px;

    font-weight: 400;
}

.trust-item span {

    font-size: 10px;

    color:
        rgba(255,255,255,.58);

    text-transform: uppercase;

    letter-spacing: .09em;
}


/* =========================================================
   INTRO
========================================================= */

.intro {

    padding: 125px 0;
}

.intro-grid {

    display: grid;

    grid-template-columns:
        .55fr 1.45fr;

    gap: 80px;
}

.section-index {

    color: var(--terracotta);

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .15em;
}

.intro h2,
.about h2,
.services h2,
.method h2,
.contact h2 {

    font-family:
        "Playfair Display",
        serif;

    color: var(--navy);

    font-weight: 400;

    font-size:
        clamp(38px,5vw,61px);

    line-height: 1.08;

    letter-spacing: -.025em;
}

.intro p {

    color: var(--muted);

    font-size: 18px;

    line-height: 1.9;

    max-width: 760px;
}

.intro p + p {
    margin-top: 20px;
}


/* =========================================================
   ABOUT
========================================================= */

.about {

    background: var(--sand);

    padding: 120px 0;
}

.about-grid {

    display: grid;

    grid-template-columns:
        .9fr 1.1fr;

    gap: 90px;

    align-items: center;
}


/* collage */

.about-images {

    height: 570px;

    position: relative;
}

.about-photo-main {

    width: 390px;
    height: 500px;

    object-fit: cover;

    position: absolute;

    left: 20px;
    top: 0;

    border-radius: 15px;

    box-shadow: var(--shadow);
}

.about-photo-small {

    width: 190px;
    height: 245px;

    object-fit: cover;

    position: absolute;

    right: 0;
    bottom: 0;

    border: 10px solid var(--sand);

    border-radius: 13px;
}


.about-content .eyebrow {
    margin-bottom: 18px;
}

.about-content p {

    color: var(--muted);

    line-height: 1.85;

    font-size: 15px;

    margin-top: 20px;
}

.credentials {

    margin-top: 35px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 14px;
}

.credential {

    border-top:
        1px solid
        rgba(23,56,61,.15);

    padding-top: 14px;
}

.credential strong {

    display: block;

    color: var(--navy);

    font-size: 13px;

    margin-bottom: 3px;
}

.credential span {

    font-size: 11px;

    color: var(--muted);
}


/* =========================================================
   SERVICES
========================================================= */

.services {

    padding: 125px 0;
}

.services-heading {

    display: flex;

    justify-content: space-between;

    align-items: end;

    gap: 50px;

    margin-bottom: 60px;
}

.services-heading p {

    max-width: 390px;

    color: var(--muted);

    font-size: 14px;

    line-height: 1.8;
}

.service-grid {

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 16px;
}

.service {

    min-height: 290px;

    background: white;

    border: 1px solid var(--border);

    padding: 30px;

    border-radius: 18px;

    transition: .35s;

    position: relative;
}

.service:hover {

    transform:
        translateY(-7px);

    box-shadow: var(--shadow);

    border-color:
        rgba(23,56,61,.08);
}

.service-number {

    font-family:
        "Playfair Display",
        serif;

    color:
        rgba(23,56,61,.12);

    font-size: 55px;

    position: absolute;

    right: 20px;
    top: 12px;
}

.service-icon {

    width: 45px;
    height: 45px;

    border-radius: 12px;

    display: grid;

    place-items: center;

    background:
        var(--sage-light);

    color: var(--navy);

    margin-bottom: 30px;

    font-size: 17px;
}

.service:nth-child(2)
.service-icon {

    background:
        #f5ebe6;

    color: var(--terracotta);
}

.service:nth-child(3)
.service-icon {

    background:
        #f3eee2;

    color: var(--gold);
}

.service h3 {

    font-family:
        "Playfair Display",
        serif;

    color: var(--navy);

    font-size: 25px;

    font-weight: 500;

    line-height: 1.15;

    margin-bottom: 12px;
}

.service p {

    color: var(--muted);

    font-size: 13px;

    line-height: 1.75;
}


/* =========================================================
   METHOD
========================================================= */

.method {

    background: var(--navy);

    color: white;

    padding: 120px 0;
}

.method-grid {

    display: grid;

    grid-template-columns:
        .8fr 1.2fr;

    gap: 100px;
}

.method .eyebrow {
    color: #d7a28e;
}

.method h2 {
    color: white;

    margin-bottom: 25px;
}

.method-intro > p {

    color:
        rgba(255,255,255,.63);

    line-height: 1.85;

    max-width: 450px;
}

.steps {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 35px;

    align-content: center;
}

.step {

    border-top:
        1px solid
        rgba(255,255,255,.18);

    padding-top: 18px;
}

.step-number {

    color: #d7a28e;

    font-size: 11px;

    letter-spacing: .15em;

    margin-bottom: 25px;
}

.step h3 {

    font-family:
        "Playfair Display",
        serif;

    font-size: 23px;

    font-weight: 400;

    margin-bottom: 8px;
}

.step p {

    color:
        rgba(255,255,255,.55);

    font-size: 12px;

    line-height: 1.7;
}


/* =========================================================
   TESTIMONIAL
========================================================= */

.testimonial {

    padding: 120px 0;

    background: var(--cream);

    text-align: center;
}

.testimonial-inner {

    max-width: 850px;

    margin: auto;
}

.quote-mark {

    font-family:
        "Playfair Display",
        serif;

    color: var(--terracotta);

    font-size: 65px;

    line-height: .5;
}

blockquote {

    font-family:
        "Playfair Display",
        serif;

    color: var(--navy);

    font-size:
        clamp(27px,4vw,43px);

    line-height: 1.3;

    margin: 25px 0;
}

.testimonial small {

    color: var(--muted);

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: .12em;
}


/* =========================================================
   FAQ
========================================================= */

.faq {

    background: var(--sand);

    padding: 110px 0;
